<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

    <script>
        const stripe = Stripe('pk_test_your_publishable_key_here');

        async function fetchOrderDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session_id');
            if (!sessionId) {
                document.getElementById('order-number').textContent = 'Not Available';
                document.getElementById('purchased-items').innerHTML = '<li>No items found.</li>';
                document.getElementById('order-total').textContent = 'Not Available';
                return;
            }

            try {
                // Retrieve session from local storage or server (mocked here for simplicity)
                const cart = JSON.parse(localStorage.getItem('cart')) || [];
                const itemsList = document.getElementById('purchased-items');
                cart.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = `${item.product} - $${item.price} x ${item.quantity}`;
                    itemsList.appendChild(li);
                });

                // Calculate total
                const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                document.getElementById('order-total').textContent = `$${total.toFixed(2)}`;

                // Set order number
                document.getElementById('order-number').textContent = sessionId;

                // Clear cart after displaying
                localStorage.removeItem('cart');
            } catch (error) {
                console.error('Error fetching order details:', error);
                document.getElementById('order-number').textContent = 'Error';
                document.getElementById('purchased-items').innerHTML = '<li>Error loading items.</li>';
                document.getElementById('order-total').textContent = 'Error';
            }
        }

        window.onload = fetchOrderDetails;
    </script>
